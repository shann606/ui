<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
	data-bs-theme="white">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="">
<meta name="author"
	content="Mark Otto, Jacob Thornton, and Bootstrap contributors">

<title>Expense Tracker</title>

<!-- Bootstrap CSS -->
<link rel="stylesheet" th:href="@{/css/bootstrap/bootstrap.min.css}">
<link rel="stylesheet"
	th:href="@{https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css}">

<!-- Custom CSS -->

<link rel="stylesheet" th:href="@{/css/sidebar1.css}">

<!-- Theme JS -->
<script th:src="@{/js/bootstrap/color-modes.js}"></script>
<script th:src="@{/js/bootstrap/bootstrap.bundle.min.js}"></script>

<!--  calling microservices -->
<script th:src="@{/js/expenses.js}" defer></script>

<meta name="theme-color" content="#712cf9">
<title>Expense Dashboard. Track your Expense</title>



</head>




<body>

	<div th:replace="~{fragments/header1 :: header}"></div>
	<div class="container-fluid">
		<div class="row">

			<!-- Sidebar -->
			<div class="col-md-3 col-lg-2 p-0">
				<div th:replace="~{fragments/sidebar1 :: sidebar}"></div>
			</div>

			<!-- Main Content -->

			<main class="col-md-9 col-lg-10 ps-5 pe-4 pt-4 pb-4">
				<!-- Main Content -->
				<div class="container-fluid">

					<!-- Category Card -->
					<div class="card shadow-sm border-0">

						<!-- Header -->
						<div class="card-header bg-white border-bottom py-3">

							<div
								class="d-flex justify-content-between align-items-center flex-wrap">

								<div>
									<h4 class="mb-1 fw-semibold text-dark" id="title">
										<i class="bi bi-folder2-open me-2 text-primary"></i>
									</h4>

									<p class="text-secondary mb-0">Track Expenses , Save
										more</p>
								</div>



							</div>

						</div>

						<!-- Body -->
						<div class="card-body">

							<!-- Hidden Values -->
							<input type="hidden" id="loggedinrole" th:value="${roles}">

							<div id="responseError" class="alert alert-danger d-none"
								role="alert"></div>

							<div id="responseSuccess" class="alert alert-success d-none"
								role="alert"></div>

                            <input type="hidden" id="userId" name="userId" th:value="${id}">
                             <input type="hidden" id="expId" name="expId">
							<!-- Form -->
							<form id="addexpense" method="POST">
						

								<div class="row g-4">

									<!-- Category Name -->
									<div class="col-md-6">
										<div class="form-floating mb-3">
											<select class="form-select"
												aria-label="Default select example" name="categories"
												id="categories">
												<option selected>Select Category</option>
												<option value="">Loading Categories...</option>
											</select>
										</div>

									</div>

									<!-- Sub-Category -->
									<div class="col-md-6">

										<div class="form-floating mb-3">
											<select class="form-select"
												aria-label="Default select example" name="subcategories"
												id="subcategories">
												<option selected>Select Sub-Category</option>
												<option value="">Loading Sub-Categories...</option>
											</select>
										</div>

									</div>


									<!-- Amount -->
									<div class="col-md-6">
										<div class="form-floating mb-3">
											<input type="number" class="form-control" id="amount"
												name="amount"
												placeholder="Amount" min="0" step="0.01" required> <label
												for="amount">Amount</label>
										</div>
									</div>


									<!-- Payment Type-->
									<div class="col-md-6">

										<div class="form-floating mb-3">
											<select class="form-select"
												aria-label="Default select example" name="payment"
												id="payment">
												<option selected>Select Payment Type</option>

												<option value="UPI">UPI</option>
												<option value="NETBANKING">Net-banking</option>
												<option value="CASH">Cash</option>
												<option value="CCARD">Credit-Card</option>
												<option value="DCARD">Debit-Card</option>
												<option value="WALLET">Wallet</option>
											</select>
										</div>

									</div>

									<!-- Spent on Date -->
									<div class="col-md-6">
										<label for="spenton" class="form-label">Spent On</label>
										<div class="form-floating mb-3">
											<input type="date" class="form-control" id="spenton"
												name="spenton" >
										</div>

									</div>


									<!-- Comments -->
									<div class="col-12">

										<label for="comments" class="form-label"> Comments
										</label>

										<textarea id="comments" class="form-control" rows="4"
											maxlength="500" placeholder="Enter comments(maximum 5 lines)"></textarea>

										<div class="form-text">Provide a short comments of the
											expense.</div>

									</div>

								</div>

								<!-- Buttons -->
								<div class="d-flex justify-content-end gap-2 mt-4">

									<button type="reset" class="btn btn-outline-secondary">

										<i class="bi bi-arrow-clockwise me-1"></i> Reset

									</button>

									<button type="submit" class="btn btn-primary" id="Submit">

										<i class="bi bi-save me-1"></i>

									</button>

								</div>

							</form>

						</div>

					</div>

				</div>




			</main>

		</div>
	</div>

</body>


</body>

</html>
