<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
	data-bs-theme="white">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="">
<meta name="author"
	content="Mark Otto, Jacob Thornton, and Bootstrap contributors">

<title>Expense Tracker</title>

<!-- Bootstrap CSS -->
<link rel="stylesheet" th:href="@{/css/bootstrap/bootstrap.min.css}">
<link rel="stylesheet"
	th:href="@{https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css}">

<!-- Custom CSS -->

<link rel="stylesheet" th:href="@{/css/sidebar1.css}">

<!-- Theme JS -->
<script th:src="@{/js/bootstrap/color-modes.js}"></script>
<script th:src="@{/js/bootstrap/bootstrap.bundle.min.js}"></script>

<!--  calling microservices -->
<script th:src="@{/js/usersearch.js}" defer></script>

<meta name="theme-color" content="#712cf9">
<title>Expense Dashboard. Track your Expense</title>



</head>




<body>

	<div th:replace="~{fragments/header1 :: header}"></div>
	<div class="container-fluid">
		<div class="row">

			<!-- Sidebar -->
			<div class="col-md-3 col-lg-2 p-0">
				<div th:replace="~{fragments/sidebar1 :: sidebar}"></div>
			</div>

			<!-- Main Content -->

			<main class="col-md-9 col-lg-10 ps-5 pe-4 pt-4 pb-4">

				<!-- Page Header -->
				<div class="d-flex justify-content-between align-items-center mb-4">

					<div>
						<h2 class="fw-bold mb-1">Users Management</h2>


					</div>

				</div>


				<!-- Search Card -->
				<div class="card shadow-sm border-0 mb-4">

					<div class="card-header bg-white">
						<h4 class="mb-0 fw-semibold text-dark">
							<i class="bi bi-search me-2"></i> User Search
						</h4>
					</div>
                     
					<div class="card-body">

						<form id="usersearch" method="get">

							<div class="row g-3">

								<!-- Username -->
								<div class="col-md-4">
									<label for="username" class="form-label">Username</label> <input
										type="text" class="form-control" id="username" name="username"
										th:value="${param.username}">
								</div>

								<!-- First Name -->
								<div class="col-md-4">
									<label for="firstname" class="form-label">First Name</label> <input
										type="text" class="form-control" id="firstname"
										name="firstname" th:value="${param.firstName}">
								</div>

								<!-- Last Name -->
								<div class="col-md-4">
									<label for="lastname" class="form-label">Last Name</label> <input
										type="text" class="form-control" id="lastname" name="lastname"
										th:value="${param.lastName}">
								</div>

								<!-- Created From -->
								<div class="col-md-3">
									<label for="fromdate" class="form-label">Created From</label> <input
										type="date" class="form-control" id="fromdate" name="fromdate"
										th:value="${param.fromDate}">
								</div>

								<!-- Created To -->
								<div class="col-md-3">
									<label for="todate" class="form-label">Created To</label> <input
										type="date" class="form-control" id="todate" name="todate"
										th:value="${param.toDate}">
								</div>

							</div>

							<!-- Buttons -->
							<div class="mt-4 d-flex justify-content-end gap-2">

								<button type="reset" class="btn btn-outline-secondary">
									<i class="bi bi-arrow-clockwise me-1"></i> Clear
								</button>

								<button type="submit" class="btn btn-primary">
									<i class="bi bi-search me-1"></i> Search
								</button>

							</div>

						</form>

					</div>

				</div>

				<!-- Search Result Card -->
				<div class="card shadow-sm border-0">

					<div class="card-header bg-white">
						<h5 class="mb-0 fw-semibold text-dark" >
							<i class="bi bi-people me-2"></i> Search Results
						</h5>
					</div>

					<div class="card-body p-0">

						<div class="table-responsive">

							<table class="table table-hover align-middle mb-0">

								<thead class="table-light">

									<tr>
										<th>Username</th>
										<th>First Name</th>
										<th>Last Name</th>
										<th>Created On</th>
										<th>Status</th>
										<th class="text-center">Action</th>
									</tr>

								</thead>

								<tbody id="userresultbody">

									<!-- Dynamic Rows -->

								</tbody>

							</table>

						</div>

					</div>

				</div>

				<!-- Pagination -->
				<div class="d-flex justify-content-between align-items-center mt-4">

					<button id="prevBtn" class="btn btn-outline-primary">
						<i class="bi bi-chevron-left"></i> Previous
					</button>

					<span id="pageInfo" class="fw-semibold text-muted"> Page 1
						of 1 </span>

					<button id="nextBtn" class="btn btn-outline-primary">
						Next <i class="bi bi-chevron-right"></i>
					</button>

				</div>



			</main>

		</div>
	</div>

</body>


</body>

</html>
