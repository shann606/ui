<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">

<head>

</head>
<body>

	<div th:fragment="sidebar">
		<!-- SIDEBAR -->
		<div class="sidebar">
			<div
				th:if="${roles.contains('ROLE_USER') || roles.contains('ROLE_ADMIN')}">
				<a th:href="@{/dashboard}">📊 Dashboard</a> 
		
				 <a	href="javascript:void(0)" id="expenseMenuBtn"
					onclick="toggleExpenseMenu()"> 💰 Expenses <span id="exparrow">▼</span>
				</a>
				<div id="expenseSubMenu" class="submenu">
					<a th:href="@{/expenses/add}">➕ Add Expenses</a> <a
						th:href="@{/expenses/edit}">✏️ Edit Expenses</a> <a
						th:href="@{/expenses/search}">🔍 Search Expenses</a>
				</div>
					
					
					
					<a th:href="@{/reports}">📈Reports</a>
				<a th:href="@{/editprofile(id=${id})}">✏️ Edit Profile</a>
			</div>
			<div th:if="${roles.contains('ROLE_ADMIN')}">
				<a th:href="@{/users}">👥User Management</a>
				 <a
					href="javascript:void(0)" id="categoryMenuBtn"
					onclick="toggleCategoryMenu()"> 📂 Categories <span id="arrow">▼</span>
				</a>

				<div id="categorySubMenu" class="submenu">
					<a th:href="@{/categories/add}">➕ Add Category</a> <a
						th:href="@{/categories/search}">🔍 Search Category</a>
				</div>


				<a th:href="@{/settings}">⚙ Settings</a>
				</th:if>
			</div>
		</div>
	</div>

</body>
</html>
