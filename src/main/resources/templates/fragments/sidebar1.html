
<div th:fragment="sidebar"
     class="flex-shrink-0 p-3 border-end"
     style="width:280px; min-height:100vh;">

    <ul class="list-unstyled ps-0">


        <!-- Dashboard -->
        <li class="mb-2"
            th:if="${roles.contains('ROLE_USER') || roles.contains('ROLE_ADMIN')}">

            <a th:href="@{/dashboard}"
               class="sidebar-link d-flex align-items-center text-decoration-none rounded">

                <i class="bi bi-speedometer2 me-2"></i>
                Dashboard

            </a>

        </li>



        <!-- Expenses -->
        <li class="mb-2"
            th:if="${roles.contains('ROLE_USER') || roles.contains('ROLE_ADMIN')}">

            <button class="btn sidebar-toggle d-flex align-items-center justify-content-between w-100 rounded border-0"
                    data-bs-toggle="collapse"
                    data-bs-target="#expenseMenu"
                    aria-expanded="false"
                    aria-controls="expenseMenu">

                <span>
                    <i class="bi bi-wallet2 me-2"></i>
                    Expenses
                </span>

                <i class="bi bi-chevron-right toggle-icon"></i>

            </button>


            <div class="collapse" id="expenseMenu">

                <ul class="btn-toggle-nav list-unstyled small ms-3 mt-2">

                    <li>
                        <a th:href="@{/expenses/add}"
                           class="sidebar-sub-link d-flex align-items-center text-decoration-none rounded">

                            <i class="bi bi-plus-circle me-2"></i>
                            Add Expense

                        </a>
                    </li>


                    <li>
                        <a th:href="@{/expenses/edit}"
                           class="sidebar-sub-link d-flex align-items-center text-decoration-none rounded">

                            <i class="bi bi-pencil-square me-2"></i>
                            Edit Expense

                        </a>
                    </li>


                    <li>
                        <a th:href="@{/expenses/search}"
                           class="sidebar-sub-link d-flex align-items-center text-decoration-none rounded">

                            <i class="bi bi-search me-2"></i>
                            Search Expense

                        </a>
                    </li>

                </ul>

            </div>

        </li>



        <!-- Reports -->
        <li class="mb-2"
            th:if="${roles.contains('ROLE_USER') || roles.contains('ROLE_ADMIN')}">

            <a th:href="@{/reports}"
               class="sidebar-link d-flex align-items-center text-decoration-none rounded">

                <i class="bi bi-bar-chart-line me-2"></i>
                Reports

            </a>

        </li>



        <!-- Edit Profile -->
        <li class="mb-2"
            th:if="${roles.contains('ROLE_USER') || roles.contains('ROLE_ADMIN')}">

            <a th:href="@{/editprofile(id=${id})}"
               class="sidebar-link d-flex align-items-center text-decoration-none rounded">

                <i class="bi bi-person-gear me-2"></i>
                Edit Profile

            </a>

        </li>



        <li class="border-top my-3"></li>



        <!-- Admin Section -->
        <li th:if="${roles.contains('ROLE_ADMIN')}"
            class="mb-2">


            <!-- Users -->
            <a th:href="@{/users}"
               class="sidebar-link d-flex align-items-center text-decoration-none rounded">

                <i class="bi bi-people me-2"></i>
                User Management

            </a>



            <!-- Categories -->
            <button class="btn sidebar-toggle d-flex align-items-center justify-content-between w-100 rounded border-0"
                    data-bs-toggle="collapse"
                    data-bs-target="#categoryMenu"
                    aria-expanded="false"
                    aria-controls="categoryMenu">


                <span>
                    <i class="bi bi-folder2-open me-2"></i>
                    Categories
                </span>


                <i class="bi bi-chevron-right toggle-icon"></i>


            </button>



            <div class="collapse" id="categoryMenu">

                <ul class="btn-toggle-nav list-unstyled small ms-3 mt-2">


                    <li>
                        <a th:href="@{/categories/add}"
                           class="sidebar-sub-link d-flex align-items-center text-decoration-none rounded">

                            <i class="bi bi-folder-plus me-2"></i>
                            Add Category

                        </a>
                    </li>
                       <li>
                        <a th:href="@{/categories/search?action=add}"
                           class="sidebar-sub-link d-flex align-items-center text-decoration-none rounded">

                            <i class="bi bi-folder-plus me-2"></i>
                           Add Sub Category

                        </a>
                    </li>


                    <li>
                        <a th:href="@{/categories/search?action=view}"
                           class="sidebar-sub-link d-flex align-items-center text-decoration-none rounded">

                            <i class="bi bi-search me-2"></i>
                            Search Category

                        </a>
                    </li>


                </ul>

            </div>



            <!-- Settings -->
            <a th:href="@{/settings}"
               class="sidebar-link d-flex align-items-center text-decoration-none rounded">

                <i class="bi bi-gear me-2"></i>
                Settings

            </a>


        </li>


    </ul>

</div>
