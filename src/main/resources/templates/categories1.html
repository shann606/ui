<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
	data-bs-theme="white">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="">
<meta name="author"
	content="Mark Otto, Jacob Thornton, and Bootstrap contributors">

<title>Expense Tracker</title>

<!-- Bootstrap CSS -->
<link rel="stylesheet" th:href="@{/css/bootstrap/bootstrap.min.css}">
<link rel="stylesheet"
	th:href="@{https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css}">

<!-- Custom CSS -->

<link rel="stylesheet" th:href="@{/css/sidebar1.css}">

<!-- Theme JS -->
<script th:src="@{/js/bootstrap/color-modes.js}"></script>
<script th:src="@{/js/bootstrap/bootstrap.bundle.min.js}"></script>

<!--  calling microservices -->
<script th:src="@{/js/category.js}" defer></script>

<meta name="theme-color" content="#712cf9">
<title>Expense Dashboard. Track your Expense</title>



</head>




<body>

	<div th:replace="~{fragments/header1 :: header}"></div>
	<div class="container-fluid">
		<div class="row">

			<!-- Sidebar -->
			<div class="col-md-3 col-lg-2 p-0">
				<div th:replace="~{fragments/sidebar1 :: sidebar}"></div>
			</div>

			<!-- Main Content -->

			<main class="col-md-9 col-lg-10 ps-5 pe-4 pt-4 pb-4">
				<!-- Main Content -->
				<div class="container-fluid">

					<!-- Category Card -->
					<div class="card shadow-sm border-0">

						<!-- Header -->
						<div class="card-header bg-white border-bottom py-3">

							<div
								class="d-flex justify-content-between align-items-center flex-wrap">

								<div>
									<h4 class="mb-1 fw-semibold text-dark" id="title">
										<i class="bi bi-folder2-open me-2 text-primary"></i> 
									</h4>

									<p class="text-secondary mb-0">Manage your categories
										and subcategories</p>
								</div>

								<!-- Action Buttons -->
								<div class="d-flex gap-2 mt-3 mt-md-0">

									<a id="addsubcategory" href="#"
										class="btn btn-outline-primary btn-sm"> <i
										class="bi bi-folder-plus me-1"></i> Add Subcategory

									</a> <a id="viewsubcategory" href="#"
										class="btn btn-outline-secondary btn-sm"> <i
										class="bi bi-list-ul me-1"></i> View Subcategories

									</a>

								</div>

							</div>

						</div>

						<!-- Body -->
						<div class="card-body">

							<!-- Hidden Values -->
							<input type="hidden" id="loggedinrole" th:value="${roles}">

							<div id="responseError" class="alert alert-danger d-none"
								role="alert"></div>

							<div id="responseSuccess" class="alert alert-success d-none"
								role="alert"></div>


							<!-- Form -->
							<form id="addcategory">

								<div class="row g-4">

									<!-- Category Name -->
									<div class="col-md-6">

										<label for="catname" class="form-label"> Category Name
										</label> <input type="text" class="form-control" id="catname"
											name="catname" placeholder="Enter category name" required>

									</div>

									<!-- Status -->
									<div class="col-md-6">

										<label for="status" class="form-label"> Status </label> <select
											id="status" name="status" class="form-select">

											<option value="">Select Status</option>

											<option value="ACTIVE">Active</option>

											<option value="INACTIVE">Inactive</option>

										</select>

									</div>

									<!-- Description -->
									<div class="col-12">

										<label for="description" class="form-label">

											Description </label>

										<textarea id="description" class="form-control" rows="4"
											maxlength="500"
											placeholder="Enter category description (maximum 5 lines)"></textarea>

										<div class="form-text">Provide a short description of
											the category.</div>

									</div>

								</div>

								<!-- Buttons -->
								<div class="d-flex justify-content-end gap-2 mt-4">

									<button type="reset" class="btn btn-outline-secondary">

										<i class="bi bi-arrow-clockwise me-1"></i> Reset

									</button>

									<button type="submit" class="btn btn-primary" id="Submit">

										<i class="bi bi-save me-1"></i> 

									</button>

								</div>

							</form>

						</div>

					</div>

				</div>




			</main>

		</div>
	</div>

</body>


</body>

</html>
