<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
<title>Expense Dashboard. Track your Expense</title>

<link rel="stylesheet" th:href="@{/css/dashboard.css}">

</head>
<script src="/js/app.js" defer></script>


<body>
	<div th:replace="~{fragments/header :: header}"></div>

	<div class="container">
	
     <div th:replace="~{fragments/sidebar :: sidebar}"></div>
		
		<!-- MAIN CONTENT -->
		<div class="main-content">

			<h2>Expense Dashboard</h2>

			<div class="summary">
				<h3>
					Total Expense: <span id="totalexpense" th:text="${totalExpense}"></span>
					
				</h3>
			</div>

			<table>
				<thead>
					<tr>
						<th>ID</th>
						<th>Category</th>
						<th>Amount</th>
						<th>Date</th>
					</tr>
				</thead>

				<tbody id="expenseTableBody">
					<tr th:each="expense : ${expenses}">
						<td th:text="${expense.id}"></td>
						<td th:text="${expense.category}"></td>
						<td th:text="${expense.amount}"></td>
						<td th:text="${expense.date}"></td>
					</tr>
				</tbody>
			</table>

		</div>
	</div>

	<div th:replace="~{fragments/footer :: dashboardFooter}"></div>
</body>

</html>
